<div>
    <button id="returnHome">Return Home</button>
</div>

<div id="EditorLayout">

    <div id="sidebar">
        <!--The sidebar navigation-->
        <div id="sidebar-tabs">
            <button class="tab-btn active" data-tab="rooms">Rooms</button>
            <button class="tab-btn" data-tab="room-props">Room Properties</button>
            <button class="tab-btn" data-tab="block-props">Block Properties</button>
        </div>

        <!--The initial tab (Room Selection/creation)-->
        <div id="tab-rooms" class="tab-pane active">
            <div class="sidebar-actions">
                <button id="create-new-map">New Map</button>
                <button id="create-new-room">New Room</button>
            </div>
            <div id="MapTreeRoot" class="tree-root"></div>
        </div>

        <!--Room Properties Pane-->
        <div id="tab-room-props" class="tab-pane">
            <div id="RoomPropertiesPane">
                <span class="no-selection" id="NullOptionRoom">No Room Selected</span>
                <input type="number" class="hide-element room-prop-input" id="editXCoord" placeholder="Maximum X size" readonly disabled />
                <input type="number" class="hide-element room-prop-input" id="editYCoord" placeholder="Maximum Y size" readonly disabled />
                <input type="number" class="hide-element room-prop-input" id="editZCoord" placeholder="Maximum Z size" readonly disabled />
                <div class="room-prop-input"></div>
                <button class="info hide-element room-prop-input" id="EditRoomButton" >Edit Room</button>
            </div>
        </div>

        <!--Block Properties Pane-->
        <div id="tab-block-props" class="tab-pane">
            <div id="BlockPropertiesPane">
                <span class="no-selection" id="NullOptionBlock">No Block Selected</span>
                <input type="number" class="hide-element block-prop-input" id="showXCoord" placeholder="X Coord" readonly disabled />
                <input type="number" class="hide-element block-prop-input" id="showYCoord" placeholder="Y Coord" readonly disabled />
                <input type="number" class="hide-element block-prop-input" id="showZCoord" placeholder="Z Coord" readonly disabed />
                <button class="info hide-element block-prop-input" id="EditRoomButton" >Edit Block</button>
            </div>
        </div>
    </div>

    <div id="Space3D"></div>

    <div id="MatListSelector"></div>
</div>
